<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.4" />
    </linearGradient>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="320" fill="url(#grid)" rx="16" />

  <!-- Outer Glow Border -->
  <rect x="2" y="2" width="1196" height="316" fill="none" stroke="url(#titleGrad)" stroke-width="2" stroke-opacity="0.5" rx="14" />

  <!-- Animated Queue Flow Visuals in Background -->
  <!-- Line 1: Producer -> Queue -> Consumer -->
  <path d="M 100 240 L 1100 240" stroke="#1E293B" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Animated Glowing Dots along Queue -->
  <circle cx="100" cy="240" r="6" fill="#60A5FA">
    <animate attributeName="cx" values="100;1100" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite" />
  </circle>

  <circle cx="100" cy="240" r="5" fill="#EC4899">
    <animate attributeName="cx" values="100;1100" dur="6s" begin="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;1;0.2" dur="6s" begin="2s" repeatCount="indefinite" />
  </circle>

  <circle cx="100" cy="240" r="7" fill="#10B981">
    <animate attributeName="cx" values="100;1100" dur="5s" begin="1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" begin="1s" repeatCount="indefinite" />
  </circle>

  <!-- Glowing Background Orbs -->
  <circle cx="950" cy="80" r="120" fill="#3B82F6" opacity="0.1" filter="blur(40px)">
    <animate attributeName="r" values="100;140;100" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="200" cy="220" r="100" fill="#8B5CF6" opacity="0.1" filter="blur(40px)">
    <animate attributeName="r" values="80;120;80" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Decorative Status Cards (Positioned lower right, transparent/subtle) -->
  <g transform="translate(820, 160)" opacity="0.85">
    <rect width="280" height="54" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="25" cy="27" r="6" fill="#10B981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="42" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">RETRY POLICY : EXPONENTIAL</text>
    <text x="42" y="40" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Max Attempts: 5 | Jitter: Active</text>
  </g>

  <g transform="translate(820, 90)" opacity="0.85">
    <rect width="280" height="54" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="25" cy="27" r="6" fill="#EF4444">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="42" y="24" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">DLQ ROUTING : AUTOMATIC</text>
    <text x="42" y="40" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Poison Message Intercepted</text>
  </g>

  <!-- Main Title & Subtitle (Foreground, fully legible) -->
  <g transform="translate(60, 105)">
    <!-- Badge -->
    <rect x="0" y="0" width="230" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="14" y="18" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">⚡ AWESOME ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="0" y="72" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      Message Queue Error Handling
    </text>

    <!-- Subtitle -->
    <text x="0" y="106" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Curated DLQ Patterns, Exponential Backoff, Poison Message Recovery &amp; Failure Resiliency
    </text>

    <!-- Tech Tags Pill Row -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="100" height="24" rx="6" fill="#1E293B" />
      <text x="12" y="16" fill="#CBD5E1" font-family="sans-serif" font-size="11" font-weight="600">🚀 RabbitMQ</text>

      <rect x="110" y="0" width="110" height="24" rx="6" fill="#1E293B" />
      <text x="122" y="16" fill="#CBD5E1" font-family="sans-serif" font-size="11" font-weight="600">⚡ Apache Kafka</text>

      <rect x="230" y="0" width="90" height="24" rx="6" fill="#1E293B" />
      <text x="242" y="16" fill="#CBD5E1" font-family="sans-serif" font-size="11" font-weight="600">📦 AWS SQS</text>

      <rect x="330" y="0" width="90" height="24" rx="6" fill="#1E293B" />
      <text x="342" y="16" fill="#CBD5E1" font-family="sans-serif" font-size="11" font-weight="600">🔥 BullMQ</text>
    </g>
  </g>
</svg>
